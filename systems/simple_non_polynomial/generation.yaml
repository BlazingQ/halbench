# Initial conditions, inputs, sampling and noise settings. Dynamics are in model.xml.
schema: halbench-generation-v1
system_id: simple_non_polynomial
version: 1
initial_origin: benchmark-extension
states: &id001
- x
outputs:
- x
inputs: {}
initial:
  components:
  - mode: '1'
    draws:
      x:
        uniform:
        - 3.0
        - 10.0
    state:
      x: x
  - mode: '2'
    draws:
      x:
        uniform:
        - 3.0
        - 10.0
    state:
      x: x
defaults:
