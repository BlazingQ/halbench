# Initial conditions, inputs, sampling and noise settings. Dynamics are in model.xml.
schema: halbench-generation-v1
system_id: simple_heating_system
version: 1
initial_origin: benchmark-extension
states: &id001
- x1
outputs: *id001
inputs: {}
initial:
  components:
  - mode: '1'
    draws:
      x1:
        uniform:
        - 15.0
        - 25.0
    state:
      x1: x1
  - mode: '2'
    draws:
      x1:
        uniform:
        - 20.0
        - 30.0
    state:
      x1: x1
defaults:
  duration: 20.0
  sample_period: 0.01
  max_step: 0.2
state_scales:
- 25
measurement_scales:
- 25
process:
  channels: *id001
  scales:
  - 1.25
  interval: 0.2
observation_events: {}
acceptance: null
random_namespace: [3378426480, 4041824259, 4192118476, 620525976]
