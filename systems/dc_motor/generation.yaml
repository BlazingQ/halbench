      x1: x1
      x2: x2
      x2_d1: x2_d1
      x2_d2: x2_d2
      x2_d3: x2_d3
  - mode: '2'
    draws:
      x1:
        uniform:
        - 0.0
        - 5.0
      x2:
        uniform:
        - 0.0
        - 2.5
      x2_d1:
        uniform:
        - -1.25
        - 1.25
      x2_d2:
        uniform:
        - -1.25
        - 1.25
      x2_d3:
        uniform:
        - -1.25
        - 1.25
    state:
      x1: x1
      x2: x2
      x2_d1: x2_d1
      x2_d2: x2_d2
      x2_d3: x2_d3
defaults:
