# Initial conditions, inputs, sampling and noise settings. Dynamics are in model.xml.
schema: halbench-generation-v1
system_id: lotka_volterra
version: 1
initial_origin: benchmark-extension
states: &id001
- x1
- x2
outputs:
- x1
- x2
inputs: {}
initial:
  components:
  - mode: '1'
    draws:
      theta:
        uniform:
        - 0.0
        - 6.283185307179586
      r2:
        uniform:
        - 0.025921000000000003
        - 0.10368400000000001
    state:
      x1: 1+sqrt(r2)*cos(theta)
      x2: 1+sqrt(r2)*sin(theta)
  - mode: '2'
    draws:
      theta:
        uniform:
        - 0.0
        - 6.283185307179586
      r2:
        uniform:
        - 0.006480250000000001
        - 0.025921000000000003
    state:
      x1: 1+sqrt(r2)*cos(theta)
      x2: 1+sqrt(r2)*sin(theta)
defaults:
  duration: 10.0
  sample_period: 0.01
  max_step: 0.1
state_scales:
- 1
- 1
measurement_scales:
- 1
- 1
process:
  channels: *id001
  scales:
  - 0.1
  - 0.1
  interval: 0.1
observation_events: {}
acceptance: null
